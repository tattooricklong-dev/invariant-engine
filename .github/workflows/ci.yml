@"
name: Invariant Engine CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verify-invariants:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Run Deterministic Unit Test Suite
      run: |
        python -m unittest discover -s tests -p "test_*.py" -v

    - name: Verify Manifest Reconciliation & Baseline
      run: |
        python baremetal_cli.py reconcile -w "." -b baseline.json
"@ | Out-File -FilePath .github\workflows\ci.yml -Encoding utf8

git add .github/workflows/ci.yml
git commit -m "ci: verify baseline without self-overwrite"
git push